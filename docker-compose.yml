services:
  postgres:
    image: postgres:16-alpine
    container_name: stockiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockiq
      POSTGRES_PASSWORD: stockiq
      POSTGRES_DB: stockiq
    ports:
      - "5432:5432"
    volumes:
      - stockiq-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stockiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - stockiq-redis-data:/data

volumes:
  stockiq-postgres-data:
  stockiq-redis-data:
