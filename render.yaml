# Render "Blueprint" -- lets you deploy by pointing Render at this repo and
# clicking "New Blueprint" instead of configuring a web service by hand.
# See docs/DEPLOYMENT.md for the full walkthrough (Neon Postgres + Render).
services:
  - type: web
    name: stockiq-api
    runtime: node
    plan: free
    region: frankfurt
    # Order matters: `prisma db push` (which also regenerates the Prisma
    # Client) must run BEFORE `pnpm build`, since `nest build` needs the
    # generated client's types to compile -- there's no postinstall hook
    # doing this automatically, and a fresh checkout has no client at all.
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@11.11.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @stockiq/api exec prisma db push &&
      pnpm build
    startCommand: node apps/api/dist/main.js
    # AppController only has a GET /health route (returns 200 {status:"ok"});
    # there's no handler for GET / at all, so it 404s -- Render's health
    # check needs a 2xx response, and was stuck waiting forever on a path
    # that could never return one.
    healthCheckPath: /health
    envVars:
      # pnpm 11.11.0 requires Node >=22.13 (it uses the node:sqlite builtin
      # internally) -- Render defaults to Node 20 otherwise, which crashes
      # corepack's pnpm install with "No such built-in module: node:sqlite".
      - key: NODE_VERSION
        value: "22"
      # Render's internal health check always probes port 10000 for a
      # "node" runtime web service, regardless of what the app itself
      # thinks its default is. Deleting this var from render.yaml did NOT
      # remove the stale PORT=3000 already set on the service (Blueprint
      # sync updates values for vars still listed here, but doesn't delete
      # ones that disappear from the file) -- so it's set explicitly to the
      # value Render actually expects instead.
      - key: PORT
        value: "10000"

      # --- Secrets: fill these in on the Render dashboard after the first
      # deploy (Blueprint envVars with no value/sync must be entered manually,
      # Render never reads them from this file). ---
      - key: DATABASE_URL
        sync: false # Neon connection string, see docs/DEPLOYMENT.md
      - key: FINNHUB_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret; auth module exists but is unused
      - key: JWT_EXPIRES_IN
        value: "7d"
